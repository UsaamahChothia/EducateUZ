<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EducateUZ - Instant 1-on-1 Tutoring</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Educate<span>UZ</span></h1>
            <span class="user-tag">{{ current_user.email }} (Student)</span>
        </header>

        <div class="hero">
            <h2>On-Demand Academic Help</h2>
            <p>Connect to a verified IEB / CAPS subject tutor in real time.</p>
        </div>

        <form action="{{ url_for('request_tutor') }}" method="POST" class="request-box">
            <select name="subject" id="subject" required>
                <option value="" disabled selected>Select school subject...</option>
                {% for phase, subject_list in subjects.items() %}
                    <optgroup label="{{ phase }}">
                        {% for subject in subject_list %}
                            <option value="{{ subject }}">{{ subject }}</option>
                        {% endfor %}
                    </optgroup>
                {% endfor %}
            </select>
            <button type="submit" class="btn-request">Request Instant Session</button>
        </form>

        <br>
        <a href="{{ url_for('logout') }}" style="color: #64748b; font-size: 0.85rem; text-decoration: none;">Sign Out</a>
    </div>
</body>
</html>
