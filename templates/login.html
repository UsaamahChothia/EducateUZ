<!DOCTYPE html>
<html>
<head>
    <title>Login - EducateUZ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <h1>Login to <span>UZ</span></h1>
        <form method="POST">
            <input type="email" name="email" placeholder="Email" required style="width:90%; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid #ddd;">
            <input type="password" name="password" placeholder="Password" required style="width:90%; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid #ddd;">
            <button type="submit" class="btn-request">Login</button>
        </form>
        <p style="margin-top:15px;"><a href="/register" style="color:#666; font-size:0.9em;">Don't have an account? Register</a></p>
    </div>
</body>
</html>
