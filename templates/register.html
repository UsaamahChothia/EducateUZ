<!DOCTYPE html>
<html>
<head>
    <title>Join EducateUZ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <h1>Join <span>UZ</span></h1>
        <form method="POST">
            <input type="email" name="email" placeholder="Email" required style="width:90%; padding:10px; margin-bottom:10px;">
            <input type="password" name="password" placeholder="Password" required style="width:90%; padding:10px; margin-bottom:10px;">
            <select name="role" id="role-select" style="width:97%; padding:10px; margin-bottom:10px;" onchange="toggleQuals()">
                <option value="Student">I am a Student</option>
                <option value="Tutor">I am a Tutor</option>
            </select>
            <div id="qual-box" style="display:none;">
                <textarea name="qualifications" placeholder="List your qualifications..." style="width:90%; padding:10px; height:60px;"></textarea>
            </div>
            <button type="submit" class="btn-request">Create Account</button>
        </form>
    </div>
    <script>
        function toggleQuals() {
            var role = document.getElementById("role-select").value;
            document.getElementById("qual-box").style.display = (role === "Tutor") ? "block" : "none";
        }
    </script>
</body>
</html>
